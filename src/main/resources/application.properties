# Clave secreta para firmar JWT. Debe ser una cadena Base64 que decodifique a
# al menos 32 bytes (256 bits), que es el mínimo que exige HS256.
# En producción hay que cambiarla por una aleatoria y no subirla al repositorio.
jwt.secret=abaf4ed6f19e513ef5908eb2412c20207c4e726ce6fc9cd9fb8719bdfd928f5b
# Tiempo de expiración del token de acceso en milisegundos (15 minutos)
jwt.access-expiration=900000
# Tiempo de expiración del token de refresco en milisegundos (7 días)
jwt.refresh-expiration=604800000

# Importar películas de TMDB al iniciar la aplicación (true/false)
movies.import.on-startup=true

# Importación periódica de películas nuevas desde TMDB.
# Cron de Spring (segundo minuto hora día-mes mes día-semana).
# "0 0 12 * * SUN" = todos los domingos a las 12:00 (mediodía).
movies.import.cron=0 0 12 * * SUN
movies.import.zone=Europe/Madrid
# Número de páginas de TMDB a recorrer en cada importación periódica.
movies.import.pages=50

