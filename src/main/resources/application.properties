spring.application.name=Movienatic

spring.datasource.url=jdbc:postgresql://localhost:5432/movienaticdb
spring.datasource.username=adminatic
spring.datasource.password=movienatic2026
spring.datasource.driver-class-name=org.postgresql.Driver

# Utilizamos hibernate.ddl-auto=update para que Hibernate actualice automáticamente el esquema de la base de datos, es decir "sincroniza pero sin destruir nada"
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Evita que Jackson serialice campos sin @JsonView cuando se especifica una vista
spring.jackson.mapper.default-view-inclusion=false

